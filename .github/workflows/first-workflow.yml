name: first workflow
on:
  workflow_dispatch:
    inputs:
      versionName:
        required: true
        description: "this is version name for github workflow"
  # repository_dispatch:
  #   types: [test]
  push:
  #   branches:
  #     - "main"
  # pull_request:
  #   branches:
  #     - "feature"
  #   types: [opened, closed]
jobs:
  first-workflow-job:
    name: first job
    runs-on: ubuntu-latest
    steps:
      - name: before checkout action
        if: github.ref == 'refs/heads/main'
        run: ls
        shell: bash

      - name: checkout steps
        uses: actions/checkout@v3
        
      - name: after checkout action
        if: github.event.inputs.versionName == 'main'
        run: ls
        shell: bash